
# ===== Server =====
server.port=8080
# Alamat aplikasi tetap http://localhost:8080/finease/ seperti sebelumnya
server.servlet.context-path=/finease

# ===== Koneksi database (dulu di Db.java / hibernate.cfg.xml) =====
spring.datasource.url=jdbc:mysql://localhost:3306/finease?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

# ===== Hibernate / JPA =====
# none = Hibernate TIDAK mengubah tabel; tabel dari finease.sql dipakai apa adanya
spring.jpa.hibernate.ddl-auto=none
# Tampilkan SQL buatan Hibernate di log (bagus untuk belajar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Data dibaca di dalam Service, bukan di Controller (lebih rapi)
spring.jpa.open-in-view=false