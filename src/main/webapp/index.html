<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finease</title>
<style>
  :root{--p:#0f766e;--pd:#134e4a;--bg:#f1f5f9;--card:#fff;--tx:#1e293b;--mut:#64748b;--line:#e2e8f0;--bad:#dc2626;--ok:#16a34a}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx)}
  aside{position:fixed;inset:0 auto 0 0;width:230px;background:var(--pd);color:#ccfbf1;padding:18px 12px;z-index:20;transition:transform .2s}
  .brand{font-size:22px;font-weight:700;color:#fff;padding:4px 12px 18px}
  aside a{display:block;padding:10px 12px;border-radius:8px;color:#99f6e4;cursor:pointer;margin-bottom:2px}
  aside a:hover{background:#ffffff14} aside a.on{background:var(--p);color:#fff;font-weight:600}
  .wrap{margin-left:230px}
  header{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  header h1{font-size:18px;margin:0;flex:1}
  #burger{display:none;background:none;color:var(--tx);font-size:20px;padding:2px 8px}
  .pill{font-size:12px;padding:4px 10px;border-radius:99px;background:#fee2e2;color:var(--bad)} .pill.ok{background:#dcfce7;color:var(--ok)}
  main{max-width:980px;margin:22px auto;padding:0 20px}
  h2{margin:0 0 14px;font-size:18px}
  .box{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 1px 3px #0001;margin-bottom:16px;overflow-x:auto}
  table{width:100%;border-collapse:collapse} th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
  th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase} tr:hover td{background:#f8fafc} .n{text-align:right;white-space:nowrap}
  .tot td{font-weight:700;background:#f0fdfa}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:16px}
  .card{background:var(--card);padding:16px;border-radius:12px;box-shadow:0 1px 3px #0001;border-left:4px solid var(--p)}
  .card small{color:var(--mut)} .card b{display:block;font-size:20px;margin-top:4px}
  .row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  input,select{padding:9px;border:1px solid #cbd5e1;border-radius:8px;width:100%;font-size:14px;background:#fff}
  input:focus,select:focus{outline:2px solid #5eead4;border-color:var(--p)}
  button{background:var(--p);color:#fff;border:0;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:14px}
  button:hover{filter:brightness(1.1)} button.sec{background:#475569} button.del{background:var(--bad);padding:4px 10px;font-size:12px}
  .totbar{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:10px 0}
  .empty{color:var(--mut);text-align:center;padding:22px}
  #toast{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;flex-direction:column;gap:8px}
  .t{padding:11px 16px;border-radius:8px;color:#fff;box-shadow:0 4px 12px #0003;animation:in .2s}
  .t.ok{background:var(--ok)} .t.bad{background:var(--bad)} @keyframes in{from{opacity:0;transform:translateY(8px)}}
  #modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:60}
  #modal[hidden]{display:none} #modal div{background:#fff;padding:22px;border-radius:12px;width:min(340px,90%)}
  #modal p{margin:0 0 16px} #modal .row{justify-content:flex-end;margin:0}
  @media(max-width:800px){aside{transform:translateX(-100%)} aside.open{transform:none} .wrap{margin-left:0} #burger{display:block}}
  @media print{aside,header button,.row,#toast{display:none} .wrap{margin:0}}
</style>
</head>
<body>
<aside id="side"><div class="brand">💼 FinEase</div><nav id="nav"></nav></aside>
<div class="wrap">
  <header>
    <button id="burger" onclick="$('side').classList.toggle('open')">☰</button>
    <h1 id="title"></h1><span id="conn" class="pill">● Menghubungkan…</span>
    <button class="sec" onclick="print()">🖨 Cetak</button>
  </header>
  <main>
    <section id="dash"></section>

    <section id="acc" hidden>
      <div class="box"><h2>Tambah Akun</h2>
        <div class="row"><input id="ac" placeholder="Kode (mis. 1103)" style="max-width:150px"><input id="an" placeholder="Nama akun" style="flex:1">
          <select id="at" style="max-width:160px"><option>ASSET</option><option>LIABILITY</option><option>EQUITY</option><option>REVENUE</option><option>EXPENSE</option></select>
          <button onclick="addAcc()">+ Tambah</button></div></div>
      <div class="box"><table id="accTable"></table></div>
    </section>

    <section id="jur" hidden>
      <div class="box"><h2>Catat Jurnal</h2>
        <div class="row"><input type="date" id="jd" style="max-width:180px"><input id="jn" placeholder="Keterangan transaksi" style="flex:1"></div>
        <table><thead><tr><th>Akun</th><th>Debit</th><th>Kredit</th></tr></thead><tbody id="jl"></tbody></table>
        <div class="totbar"><span>Debit: <b id="td">Rp 0,00</b></span><span>Kredit: <b id="tk">Rp 0,00</b></span><span id="diff" class="pill"></span></div>
        <div class="row"><button class="sec" onclick="addRow()">+ Baris</button><button onclick="saveJournal()">Simpan Jurnal</button></div>
      </div>
      <div class="box"><h2>Riwayat Jurnal</h2><table id="jurTable"></table></div>
    </section>

    <section id="led" hidden>
      <div class="box"><select id="lsel" onchange="render()"></select></div>
      <div class="box" id="ledOut"></div>
    </section>

    <section id="trial" hidden></section>
    <section id="pl" hidden></section>
    <section id="bs" hidden></section>
  </main>
</div>
<div id="toast"></div>
<div id="modal" hidden><div><p id="mmsg"></p><div class="row"><button class="sec" id="mno">Batal</button><button class="del" id="myes" style="padding:9px 16px;font-size:14px">Ya, hapus</button></div></div></div>

<script>
const $ = id => document.getElementById(id);
const PAGES = {dash:['📊','Dashboard'],acc:['📒','Akun'],jur:['✍️','Jurnal Umum'],led:['📖','Buku Besar'],trial:['⚖️','Neraca Saldo'],pl:['📈','Laba Rugi'],bs:['🏦','Neraca']};
let db = {accounts: [], journals: []};

const rp = n => 'Rp ' + n.toLocaleString('id-ID', {minimumFractionDigits: 2});
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byCode = (a, b) => a.code.localeCompare(b.code);
const isCredit = t => t === 'LIABILITY' || t === 'EQUITY' || t === 'REVENUE';

// ===== Komunikasi ke api.php =====
async function api(a, body) {
const r = await fetch('api?a=' + a, {method: body ? 'POST' : 'GET', headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined});
  let j; try { j = await r.json(); } catch (_) { throw new Error('API tidak merespons. Pastikan Tomcat & MySQL aktif.'); }
  if (j.error) throw new Error(j.error);
  return j;
}
async function load() {
  try { db = await api('load'); $('conn').className = 'pill ok'; $('conn').textContent = '● Terhubung ke MySQL'; }
  catch (e) { $('conn').className = 'pill'; $('conn').textContent = '● Terputus'; toast(e.message, false); }
  fillSelects(); render();
}

// ===== UI helper =====
function toast(msg, ok = true) {
  const t = document.createElement('div'); t.className = 't ' + (ok ? 'ok' : 'bad'); t.textContent = msg;
  $('toast').append(t); setTimeout(() => t.remove(), 3500);
}
function ask(msg) {
  return new Promise(res => {
    $('mmsg').textContent = msg; $('modal').hidden = false;
    $('myes').onclick = () => { $('modal').hidden = true; res(true); };
    $('mno').onclick = () => { $('modal').hidden = true; res(false); };
  });
}
function go(p) {
  document.querySelectorAll('main > section').forEach(s => s.hidden = s.id !== p);
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.p === p));
  $('title').textContent = PAGES[p][1]; $('side').classList.remove('open'); render();
}

// ===== Perhitungan =====
function net() {
  const m = {}; db.accounts.forEach(a => m[a.code] = 0);
  db.journals.forEach(j => j.lines.forEach(l => { if (l.acc in m) m[l.acc] += l.d - l.k; }));
  return m;
}
const bal = (a, m) => isCredit(a.type) ? -m[a.code] : m[a.code];

// ===== Render =====
function render() {
  const m = net(), by = t => db.accounts.filter(a => a.type === t).sort(byCode);
  const sum = t => by(t).reduce((s, a) => s + bal(a, m), 0);
  const A = sum('ASSET'), Li = sum('LIABILITY'), Eq = sum('EQUITY'), R = sum('REVENUE'), E = sum('EXPENSE'), L = R - E;
  const names = {}; db.accounts.forEach(a => names[a.code] = a.name);
  const card = (t, v, c) => `<div class="card" style="border-color:${c}"><small>${t}</small><b>${rp(v)}</b></div>`;

  // Dashboard + 5 transaksi terakhir
  const recent = db.journals.slice(-5).reverse().map(j => `<tr><td>${j.date}</td><td>${esc(j.desc)}</td><td class="n">${rp(j.lines.reduce((s, l) => s + l.d, 0))}</td></tr>`).join('');
  $('dash').innerHTML = '<div class="cards">' + card('Total Aset', A, '#0f766e') + card('Total Kewajiban', Li, '#d97706') + card('Ekuitas', Eq, '#2563eb') +
    card('Pendapatan', R, '#16a34a') + card('Beban', E, '#dc2626') + card('Laba/Rugi', L, L >= 0 ? '#16a34a' : '#dc2626') + '</div>' +
    '<div class="box"><h2>Transaksi Terakhir</h2>' + (recent ? `<table><tr><th>Tgl</th><th>Keterangan</th><th>Nilai</th></tr>${recent}</table>` : '<div class="empty">Belum ada transaksi. Mulai dari menu Jurnal Umum.</div>') + '</div>';

  // Akun
  $('accTable').innerHTML = '<tr><th>Kode</th><th>Nama</th><th>Tipe</th></tr>' +
    db.accounts.map(a => `<tr><td>${esc(a.code)}</td><td>${esc(a.name)}</td><td>${a.type}</td></tr>`).join('');

  // Riwayat jurnal
  $('jurTable').innerHTML = db.journals.length ? '<tr><th>Tgl</th><th>Keterangan</th><th>Akun</th><th>Debit</th><th>Kredit</th><th></th></tr>' +
    db.journals.slice().reverse().map(j => j.lines.map((l, n) =>
      `<tr><td>${j.date}</td><td>${esc(j.desc)}</td><td>${esc(names[l.acc] || l.acc)}</td><td class="n">${rp(l.d)}</td><td class="n">${rp(l.k)}</td>` +
      (n === 0 ? `<td rowspan="${j.lines.length}"><button class="del" onclick="delJ(${j.id})">Hapus</button></td>` : '') + '</tr>').join('')).join('')
    : '<tr><td class="empty">Belum ada jurnal.</td></tr>';

  // Buku besar
  const code = $('lsel').value;
  if (!code) $('ledOut').innerHTML = '<div class="empty">Pilih akun untuk melihat buku besarnya.</div>';
  else {
    const acc = db.accounts.find(a => a.code === code); let s = 0;
    const rows = db.journals.flatMap(j => j.lines.filter(l => l.acc === code).map(l => ({date: j.date, desc: j.desc, d: l.d, k: l.k})));
    $('ledOut').innerHTML = `<h2>${esc(acc.code)} - ${esc(acc.name)}</h2><table><tr><th>Tgl</th><th>Keterangan</th><th>Debit</th><th>Kredit</th><th>Saldo</th></tr>` +
      rows.map(r => { s += isCredit(acc.type) ? r.k - r.d : r.d - r.k;
        return `<tr><td>${r.date}</td><td>${esc(r.desc)}</td><td class="n">${rp(r.d)}</td><td class="n">${rp(r.k)}</td><td class="n">${rp(s)}</td></tr>`; }).join('') +
      `<tr class="tot"><td colspan="4">Saldo akhir</td><td class="n">${rp(s)}</td></tr></table>`;
  }

  // Neraca saldo
  let td = 0, tk = 0;
  const rows = db.accounts.slice().sort(byCode).map(a => {
    const v = m[a.code], d = v > 0 ? v : 0, k = v < 0 ? -v : 0; td += d; tk += k;
    return `<tr><td>${esc(a.code)}</td><td>${esc(a.name)}</td><td class="n">${rp(d)}</td><td class="n">${rp(k)}</td></tr>`;
  }).join('');
  $('trial').innerHTML = '<div class="box"><h2>Neraca Saldo</h2><table><tr><th>Kode</th><th>Akun</th><th>Debit</th><th>Kredit</th></tr>' + rows +
    `<tr class="tot"><td colspan="2">TOTAL</td><td class="n">${rp(td)}</td><td class="n">${rp(tk)}</td></tr></table>` +
    `<span class="pill ${Math.abs(td - tk) < 0.005 ? 'ok' : ''}">${Math.abs(td - tk) < 0.005 ? '✔ Balance' : '✘ Tidak balance'}</span></div>`;

  // Laba rugi & neraca
  const list = t => by(t).map(a => `<tr><td>${esc(a.code)} - ${esc(a.name)}</td><td class="n">${rp(bal(a, m))}</td></tr>`).join('');
  const head = t => `<tr><th colspan="2">${t}</th></tr>`, total = (t, v) => `<tr class="tot"><td>${t}</td><td class="n">${rp(v)}</td></tr>`;
  $('pl').innerHTML = '<div class="box"><h2>Laporan Laba Rugi</h2><table>' + head('Pendapatan') + list('REVENUE') + total('Total Pendapatan', R) +
    head('Beban') + list('EXPENSE') + total('Total Beban', E) + total(L >= 0 ? 'LABA BERSIH' : 'RUGI BERSIH', L) + '</table></div>';
  const ok = Math.abs(A - (Li + Eq + L)) < 0.005;
  $('bs').innerHTML = '<div class="box"><h2>Neraca (Posisi Keuangan)</h2><table>' + head('Aset') + list('ASSET') + total('Total Aset', A) +
    head('Kewajiban') + list('LIABILITY') + total('Total Kewajiban', Li) + head('Ekuitas') + list('EQUITY') +
    `<tr><td>Laba/Rugi berjalan</td><td class="n">${rp(L)}</td></tr>` + total('Total Ekuitas', Eq + L) + total('Total Kewajiban + Ekuitas', Li + Eq + L) +
    `</table><span class="pill ${ok ? 'ok' : ''}">${ok ? '✔ Aset = Kewajiban + Ekuitas' : '✘ Tidak seimbang'}</span></div>`;
}

function fillSelects() {
  const opts = db.accounts.slice().sort(byCode).map(a => `<option value="${esc(a.code)}">${esc(a.code)} - ${esc(a.name)}</option>`).join('');
  document.querySelectorAll('.sel').forEach(s => { const v = s.value; s.innerHTML = '<option value="">-- akun --</option>' + opts; s.value = v; });
  const cur = $('lsel').value; $('lsel').innerHTML = '<option value="">-- pilih akun --</option>' + opts; $('lsel').value = cur;
}

// ===== Form jurnal =====
function addRow() {
  $('jl').insertAdjacentHTML('beforeend', '<tr><td><select class="sel"></select></td><td><input class="d" type="number" min="0" step="any"></td><td><input class="k" type="number" min="0" step="any"></td></tr>');
  fillSelects();
}
function updTot() {
  let td = 0, tk = 0;
  document.querySelectorAll('.d').forEach(x => td += +x.value || 0);
  document.querySelectorAll('.k').forEach(x => tk += +x.value || 0);
  $('td').textContent = rp(td); $('tk').textContent = rp(tk);
  const same = Math.abs(td - tk) < 0.005, empty = td === 0 && tk === 0;
  $('diff').className = 'pill' + (same && !empty ? ' ok' : '');
  $('diff').textContent = empty ? 'Isi nilai debit/kredit' : same ? '✔ Balance' : 'Selisih ' + rp(Math.abs(td - tk));
}

// ===== Aksi =====
async function addAcc() {
  try {
    await api('addAccount', {code: $('ac').value, name: $('an').value, type: $('at').value});
    $('ac').value = $('an').value = ''; toast('Akun ditambahkan'); await load();
  } catch (e) { toast(e.message, false); }
}
async function saveJournal() {
  const sel = document.querySelectorAll('.sel'), d = document.querySelectorAll('.d'), k = document.querySelectorAll('.k'), lines = [];
  sel.forEach((s, i) => { const a = +d[i].value || 0, b = +k[i].value || 0; if (s.value && (a || b)) lines.push({acc: s.value, d: a, k: b}); });
  try {
    await api('saveJournal', {date: $('jd').value, desc: $('jn').value, lines});
    $('jn').value = ''; d.forEach(x => x.value = ''); k.forEach(x => x.value = ''); sel.forEach(x => x.value = ''); updTot();
    toast('Jurnal tersimpan'); await load();
  } catch (e) { toast(e.message, false); }
}
async function delJ(id) {
  if (!await ask('Hapus jurnal ini? Tindakan tidak bisa dibatalkan.')) return;
  try { await api('delJournal', {id}); toast('Jurnal dihapus'); await load(); } catch (e) { toast(e.message, false); }
}

// ===== Inisialisasi =====
$('nav').innerHTML = Object.entries(PAGES).map(([k, [i, t]]) => `<a data-p="${k}" onclick="go('${k}')">${i} ${t}</a>`).join('');
for (let i = 0; i < 6; i++) addRow();
$('jl').addEventListener('input', updTot); updTot();
$('jd').valueAsDate = new Date();
go('dash'); load();
</script>
</body>
</html>
